name: Visual Inspector security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-inspector-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore existing dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and run synthetic regression tests
        run: npm test
      - name: Audit dependency lock
        run: npm audit --package-lock-only --audit-level=low
